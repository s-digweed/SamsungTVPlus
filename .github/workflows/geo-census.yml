name: Samsung geo census

# Weekly: tunnel the runner out of a NON-Samsung country (Proton WireGuard, secret
# WG_CENSUS) and record which channels play from abroad -> geo_census.tsv.
on:
  schedule:
    - cron: '41 2 * * 1'      # Mondays 02:41 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: samsung-tvplus        # same group as the playlist job, so pushes never collide
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools
        pip install requests

    - name: Bring up WireGuard (non-Samsung country)
      env:
        WG_CONF: ${{ secrets.WG_CENSUS }}
      run: |
        if [ -z "$WG_CONF" ]; then echo "::error::WG_CENSUS secret is missing"; exit 1; fi
        # runner has no IPv6 and the tunnel must carry all traffic
        printf '%s\n' "$WG_CONF" \
          | grep -v -i '^DNS' \
          | sed -E '/^Address/ s/,[^,]*:[^,]*//g; /^Address/ s/^(Address *= *)[^,]*:[^,]*,? */\1/' \
          | sed -E 's/^AllowedIPs.*/AllowedIPs = 0.0.0.0\/0/' \
          | sudo tee /etc/wireguard/wg0.conf > /dev/null
        sudo wg-quick up wg0
        echo "nameserver 1.1.1.1" | sudo tee /etc/resolv.conf > /dev/null
        echo "Exit: $(curl -s https://ipinfo.io/country)"

    - name: Run census
      run: python -u geo_census.py

    - name: Tear down WireGuard
      if: always()
      run: sudo wg-quick down wg0 || true

    - name: Commit census
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add geo_census.tsv
        if git diff --cached --quiet; then echo "Census unchanged"; exit 0; fi
        git commit -m "Update Samsung geo census $(date -u '+%Y-%m-%d') [skip ci]"
        git pull --rebase origin main || true
        git push
